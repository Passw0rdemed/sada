<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="صدى: فريق إعلامي ذكي يدير العمل الإعلامي عبر شبكات التواصل، بالعربية والإنجليزية.">
<link rel="icon" href="media/icon.svg" type="image/svg+xml">
<title>صدى · SADA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Sora:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="themes.css">
<style>
/* Layout concept: a calm editorial control room — a deep gradient rail, an airy canvas,
   photography leading every story, state carried by quiet chips rather than loud colour. */
:root { --r-lg: 22px; --r-md: 14px; --r-sm: 10px; --ease: cubic-bezier(.2,.7,.2,1); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img, video { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; }
body { margin: 0; font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
html[lang="ar"] body { font-size: 15.5px; line-height: 1.8; }
h1, h2, h3, h4 { font-family: var(--fh); margin: 0; line-height: 1.3; text-wrap: balance; color: var(--ink); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pri-ink); }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; box-shadow: 0 0 0 5px var(--glow); border-radius: 8px; }
.ur { font-family: var(--fur); line-height: 2.3; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; color: var(--on-rail);
  background: radial-gradient(120% 60% at 80% 0%, rgba(255,255,255,.09), transparent 60%),
              linear-gradient(172deg, var(--rail1) 0%, var(--rail2) 58%, var(--rail3) 135%);
  padding: 26px 18px 22px; display: flex; flex-direction: column; gap: 22px; }
.rail::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--grain); mix-blend-mode: soft-light; }
.brand { display: flex; align-items: center; gap: 12px; padding-inline: 6px; }
.brand svg { width: 46px; height: 46px; flex: none; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
.brand b { font-family: var(--fh); font-size: 24px; font-weight: 800; letter-spacing: .01em; display: block; line-height: 1.1; }
html[lang="en"] .brand b { letter-spacing: .16em; font-size: 20px; }
.brand small { opacity: .78; font-size: 12.5px; }
.pulse { height: 22px; margin-inline: 6px; opacity: .9; }
.pulse path { stroke-dasharray: 220; stroke-dashoffset: 220; animation: beat 3.6s var(--ease) infinite; }
@keyframes beat { 0% { stroke-dashoffset: 220; } 55%, 100% { stroke-dashoffset: 0; } }
.nav { display: flex; flex-direction: column; gap: 18px; }
.nav h4 { font-family: var(--fb); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; opacity: .6; padding-inline: 12px; margin-bottom: 6px; color: var(--on-rail); }
html[lang="ar"] .nav h4 { letter-spacing: 0; font-size: 12.5px; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; color: var(--on-rail); text-decoration: none; opacity: .8; transition: background .2s, opacity .2s; }
.nav a:hover { opacity: 1; background: rgba(255,255,255,.07); }
.nav a[aria-current="page"] { opacity: 1; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.nav svg { width: 19px; height: 19px; flex: none; }
.nav .cnt { margin-inline-start: auto; font-size: 11.5px; font-weight: 700; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.18); }
.nav .cnt.hot { background: var(--on-rail); color: var(--rail1); }
.rail-foot { margin-top: auto; display: grid; gap: 10px; font-size: 12.5px; padding-inline: 6px; position: relative; z-index: 1; }
.live { display: flex; align-items: center; gap: 8px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 0 var(--glow); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--glow); } 70%, 100% { box-shadow: 0 0 0 9px transparent; } }
.rail-foot .muted-on { opacity: .72; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 16px clamp(16px, 3.2vw, 40px); border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: saturate(1.3) blur(14px); -webkit-backdrop-filter: saturate(1.3) blur(14px); }
.top .ttl { min-width: 0; flex: 1 1 260px; }
.top h1 { font-size: 23px; font-weight: 800; }
.top p { color: var(--muted); font-size: 13.5px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.view { padding-block: 28px 72px; padding-inline: clamp(16px, 3.2vw, 40px); display: grid; gap: 24px; min-width: 0; }
.banner { margin: 18px clamp(16px, 3.2vw, 40px) 0; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-radius: var(--r-md); background: var(--crit-bg); color: var(--crit); border: 1px solid color-mix(in srgb, var(--crit) 30%, transparent); }
.banner p { flex: 1 1 300px; font-weight: 600; }
.banner svg { width: 20px; height: 20px; flex: none; }

/* ---------- primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h2 { font-size: 17px; font-weight: 700; }
.card-h { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; }
.card-h small, .meta { color: var(--muted); font-size: 12.5px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pri-ink); }
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: 12.5px; }
.grid { display: grid; gap: 24px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-fit { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.g-studio { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); align-items: start; }
.g-list { grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); align-items: start; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 12px; padding: 9px 16px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform .15s var(--ease), background .2s, border-color .2s, box-shadow .2s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--pri); color: var(--on-pri); box-shadow: 0 6px 18px -8px var(--pri); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--raise); }
.btn.quiet { background: transparent; color: var(--ink2); padding-inline: 10px; }
.btn.quiet:hover { background: var(--raise); }
.btn.danger { background: var(--crit-bg); color: var(--crit); border-color: color-mix(in srgb, var(--crit) 28%, transparent); }
.btn.crisis-on { background: var(--crit); color: var(--surface); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--raise); color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.low, .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.medium, .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.sensitive, .chip.crit { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.chip.info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.chip.soft { background: var(--soft); color: var(--pri-ink); border-color: transparent; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--soft); border-color: color-mix(in srgb, var(--pri) 45%, transparent); color: var(--pri-ink); }
.toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.toggle[aria-pressed="true"] .dot { background: var(--pri); }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--ink); }
textarea.inp { min-height: 92px; resize: vertical; line-height: 1.7; }
.inp:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 4px var(--glow); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.empty { color: var(--muted); text-align: center; padding: 28px 12px; }
.av { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-family: var(--fh); font-weight: 700; background: var(--soft); color: var(--pri-ink); flex: none; font-size: 14px; }
.ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-md); display: block; background: var(--raise); }
.thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex: none; background: var(--raise); }
.libph { display: grid; place-items: center; text-align: center; gap: 8px; padding: 18px; aspect-ratio: 1; border-radius: var(--r-md); color: var(--ink2);
  background: repeating-linear-gradient(45deg, var(--raise) 0 12px, var(--surface) 12px 24px); border: 1px dashed var(--line); }
.libph.sm { aspect-ratio: auto; width: 64px; height: 64px; padding: 0; border-radius: 12px; }
.libph svg { width: 28px; height: 28px; color: var(--muted); }
.media-wrap { position: relative; }
.badge-ai { position: absolute; inset-block-end: 10px; inset-inline-start: 10px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; color: var(--on-rail); background: rgba(8,14,20,.62); backdrop-filter: blur(6px); }

/* ---------- today ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.hero-txt { display: grid; gap: 18px; align-content: start; padding-block: 6px; }
.hero h2 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 800; letter-spacing: -.01em; }
.hero .date { color: var(--ink2); font-size: 14.5px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; cursor: pointer; display: grid; gap: 4px; transition: border-color .2s, transform .2s var(--ease); }
.tile:hover { border-color: color-mix(in srgb, var(--pri) 40%, var(--line)); transform: translateY(-2px); }
.tile b { font-family: var(--fh); font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--ink); }
.tile span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tile.alert b { color: var(--crit); }
.feature { position: relative; overflow: hidden; border-radius: var(--r-lg); min-height: 320px; color: var(--on-rail); box-shadow: var(--shadow); background: var(--rail1); }
.feature img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feature::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,10,16,0) 30%, rgba(4,10,16,.82) 100%); }
.feature .cap { position: absolute; inset-inline: 0; bottom: 0; padding: 22px; z-index: 1; display: grid; gap: 8px; }
.feature .cap h3 { color: var(--on-rail); font-size: 21px; font-weight: 700; }
.feature .cap .chip { background: rgba(255,255,255,.16); color: var(--on-rail); border-color: rgba(255,255,255,.22); backdrop-filter: blur(6px); }
.feature .cap small { color: rgba(255,255,255,.86); }
.timeline { position: relative; height: 52px; margin-top: 22px; }
.timeline .bar { position: absolute; inset-inline: 0; top: 22px; height: 8px; border-radius: 99px; background: var(--raise); border: 1px solid var(--line); }
.timeline .q { position: absolute; top: 18px; height: 16px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 30%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); }
.timeline .pt { position: absolute; top: 15px; width: 12px; height: 22px; margin-inline-start: -6px; display: grid; place-items: center; }
.timeline .pt i { width: 10px; height: 10px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 0 3px var(--surface); }
.timeline .now { position: absolute; top: 6px; bottom: 6px; width: 2px; background: var(--ink); border-radius: 2px; }
.timeline .lab.up { top: -6px; }
.timeline .lab { position: absolute; top: 40px; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
html[dir="rtl"] .timeline .lab { transform: translateX(50%); }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.agent { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.agent .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft); color: var(--pri-ink); flex: none; }
.agent .ic svg { width: 18px; height: 18px; }
.agent b { font-size: 13.5px; display: block; }
.agent small { color: var(--muted); font-size: 12px; display: block; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.st.working i { background: var(--ok); animation: ping 1.8s infinite; }
.st.waiting i { background: var(--warn); }
.stages { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); align-items: start; }
.stage { display: grid; gap: 8px; }
.stage .agents { grid-template-columns: minmax(0, 1fr); }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flow .arrow { color: var(--muted); display: inline-flex; }
.flow .arrow svg { width: 18px; height: 18px; }
html[dir="rtl"] .flow .arrow { transform: scaleX(-1); }
.fstep { flex: 1 1 110px; display: grid; gap: 2px; padding: 14px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line); }
.fstep b { font-family: var(--fh); font-size: 26px; font-weight: 800; line-height: 1.1; color: var(--ink); }
.fstep span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.fstep.review { background: var(--warn-bg); border-color: transparent; }
.fstep.review b, .fstep.review span { color: var(--warn); }
.fstep.published { background: var(--ok-bg); border-color: transparent; }
.fstep.published b, .fstep.published span { color: var(--ok); }
.assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.asset { display: grid; gap: 8px; min-width: 0; }
.asset video { width: 100%; aspect-ratio: 9 / 16; max-height: 300px; object-fit: cover; border-radius: var(--r-md); background: var(--rail1); }
/* ---------- dashboards: categorical series (validated light + dark), fixed order ---------- */
:root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6; --s-neutral: #9aa3ad; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s-neutral: #5d6873; } }
:root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s-neutral: #5d6873; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.stat { padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 4px; min-width: 0; }
.stat .l { font-size: 13px; font-weight: 600; color: var(--ink2); }
.stat b { font-family: var(--fh); font-size: 32px; font-weight: 800; line-height: 1.15; color: var(--ink); }
.h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 30%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hb-l { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-t { height: 14px; border-radius: 4px; background: var(--raise); overflow: hidden; display: flex; }
.hb-t i { display: block; height: 100%; border-start-end-radius: 4px; border-end-end-radius: 4px; }
.hb-v { color: var(--ink); font-weight: 600; min-width: 64px; text-align: end; }
.target-wrap .hb-t { position: relative; }
.target-wrap .hb-t::after { content: ""; position: absolute; inset-block: -3px; inset-inline-start: var(--target); width: 2px; background: var(--ink); border-radius: 2px; }
.stack100 { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; }
.stack100.thin { height: 10px; min-width: 140px; }
.stack100 i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; height: 200px; align-items: end; }
.col { display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; min-width: 0; }
.col-bar { display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; border-radius: 4px 4px 0 0; overflow: hidden; }
.col-bar i { display: block; width: 100%; }
.col-l { font-size: 11.5px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heat-scroll { overflow-x: auto; }
.heat { display: grid; gap: 4px; min-width: 520px; }
.heat .hh { font-size: 11.5px; color: var(--muted); text-align: center; }
.heat .hd { font-size: 12.5px; color: var(--ink2); align-self: center; white-space: nowrap; }
.hc { height: 30px; border-radius: 6px; background: color-mix(in srgb, var(--s1) calc(var(--a, .5) * 100%), var(--surface)); border: 1px solid var(--line); }
.hc.q { background-image: repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb, var(--ink) 35%, transparent) 5px 6.5px); }
.hc.demo { width: 28px; height: 16px; --a: .15; }
.heat-legend { margin-top: 12px; }
.heat-legend .ramp { width: 120px; height: 10px; border-radius: 4px; background: linear-gradient(to right, color-mix(in srgb, var(--s1) 12%, var(--surface)), var(--s1)); }
html[dir="rtl"] .heat-legend .ramp { background: linear-gradient(to left, color-mix(in srgb, var(--s1) 12%, var(--surface)), var(--s1)); }
.ic.sm { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--soft); color: var(--pri-ink); flex: none; }
.ic.sm svg { width: 15px; height: 15px; }
.mini { display: grid; gap: 4px; min-width: 120px; }
.mini i { display: block; height: 6px; border-radius: 3px; background: var(--s1); }
.dtable { margin-top: 12px; }
.dtable summary { cursor: pointer; font-size: 12.5px; color: var(--pri-ink); font-weight: 600; }
.dtable .tbl-wrap { margin-top: 8px; }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 14px 18px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.sitem { display: inline-flex; align-items: center; gap: 8px; }
.sitem b { font-family: var(--fh); font-size: 20px; font-weight: 800; color: var(--ink); }
.sitem.sent { display: grid; gap: 2px; }
.sitem.sent .legend { margin-top: 2px; }
.tip { position: fixed; z-index: 80; pointer-events: none; max-width: 280px; padding: 8px 12px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
[data-tip] { cursor: default; }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hbar { grid-template-columns: minmax(72px, 34%) minmax(0, 1fr) auto; } }
.list { display: grid; }
.li { display: flex; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { min-width: 0; flex: 1; }
.li b { display: block; font-weight: 600; font-size: 14px; }
.li .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- radar ---------- */
.feed { display: grid; gap: 14px; }
.item { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 18px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.item .ph { aspect-ratio: 1; border-radius: 14px; }
.item h3 { font-size: 16.5px; font-weight: 700; }
.item .sum { color: var(--ink2); font-size: 14px; }
.item.blocked { border-style: dashed; background: color-mix(in srgb, var(--crit-bg) 40%, var(--surface)); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--raise); color: var(--ink2); font-size: 13.5px; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 3px; color: var(--pri-ink); }
.note.crit { background: var(--crit-bg); color: var(--crit); }
.note.crit svg, .note.warn svg { color: currentColor; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.corr { display: grid; gap: 10px; margin-top: 4px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.corr dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
.corr dt { color: var(--muted); font-weight: 600; }
.corr dd { margin: 0; }

/* ---------- studio ---------- */
.opt { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; background: var(--surface); text-align: start; width: 100%; }
.opt:hover { background: var(--raise); }
.opt[aria-pressed="true"] { border-color: var(--pri); box-shadow: 0 0 0 3px var(--glow); }
.opt .thumb, .opt .libph.sm { width: 48px; height: 48px; }
.opt b { font-size: 13.5px; font-weight: 600; display: block; line-height: 1.45; }
.opts { display: grid; gap: 8px; max-height: 420px; overflow-y: auto; padding: 2px; }
.pipe { display: grid; gap: 0; position: relative; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 10px 0; position: relative; }
.step::before { content: ""; position: absolute; inset-inline-start: 16px; top: 42px; bottom: -8px; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .dot { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--raise); color: var(--muted); border: 1px solid var(--line); z-index: 1; }
.step .dot svg { width: 17px; height: 17px; }
.step.run .dot { background: var(--soft); color: var(--pri-ink); border-color: var(--pri); animation: glow 1.2s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px var(--glow); } }
.step.done .dot { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.step.abstain .dot, .step.escalate .dot { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.step.block .dot { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.step.wait { opacity: .45; }
.step b { font-size: 14px; }
.step .out { font-size: 13.5px; color: var(--ink2); margin-top: 2px; white-space: pre-line; }
.gate { display: grid; gap: 12px; padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--raise); }
.chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.chain .arrow { color: var(--muted); }
html[dir="rtl"] .chain .arrow { transform: scaleX(-1); display: inline-block; }
.pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pv { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); display: grid; gap: 10px; padding: 14px; min-width: 0; }
.pv-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv-h b { font-size: 13.5px; }
.pv textarea { min-height: 150px; font-size: 13.5px; }
.pv .count { font-size: 11.5px; color: var(--muted); }
.pv .count.over { color: var(--crit); font-weight: 700; }
.pv video { width: 100%; max-height: 340px; border-radius: 12px; background: var(--rail1); display: block; }
.media-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }

/* ---------- approvals / inbox ---------- */
.qitem { width: 100%; text-align: start; display: grid; gap: 6px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.qitem:hover { background: var(--raise); }
.qitem[aria-current="true"] { border-color: var(--pri); box-shadow: 0 0 0 3px var(--glow); }
.qitem b { font-size: 14px; line-height: 1.5; }
.steps { display: grid; gap: 8px; }
.sline { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.sline.current { border-color: var(--pri); background: var(--soft); }
.sline .grow { flex: 1; min-width: 0; }
.quote { padding: 14px 16px; border-radius: 14px; background: var(--raise); border-inline-start: 3px solid var(--pri); white-space: pre-line; }
.bubble { padding: 14px 16px; border-radius: 16px; background: var(--raise); }
.bubble.reply { background: var(--soft); }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 260px; min-width: 0; }
.day.today { border-color: var(--pri); box-shadow: 0 0 0 3px var(--glow); }
.day h3 { font-size: 13.5px; font-weight: 700; }
.day .h { font-size: 11.5px; color: var(--muted); }
.slot { border-radius: 12px; padding: 8px 10px; background: var(--raise); border: 1px solid var(--line); display: grid; gap: 4px; font-size: 12.5px; min-width: 0; }
.slot b { font-size: 12.5px; line-height: 1.45; }
.slot .t { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--pri-ink); }
.slot.paused { opacity: .55; text-decoration-line: line-through; text-decoration-color: var(--muted); }
.slot s { color: var(--muted); }
.qline { font-size: 11px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 2px 8px; }

/* ---------- analytics ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.kpi .v { font-family: var(--fh); font-size: 30px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .l { font-size: 13px; font-weight: 600; color: var(--ink2); }
.kpi svg { width: 100%; height: 40px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--fb); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px; }
th, td { text-align: start; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--raise); }
tr:last-child td { border-bottom: 0; }
td .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 460px; white-space: pre-line; }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--raise); border: 1px solid var(--line); font-size: 12.5px; }
html[dir="rtl"] .term { padding: 3px 10px 3px 4px; }
.term.new { background: var(--soft); border-color: transparent; color: var(--pri-ink); }
.term button { border: 0; background: transparent; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.term button:hover { background: var(--line); color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.check svg { width: 18px; height: 18px; color: var(--ok); flex: none; margin-top: 3px; }

/* ---------- popover & toast ---------- */
.pop { position: fixed; z-index: 60; inset-block-start: calc(env(safe-area-inset-top, 0px) + 70px); inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); display: grid; gap: 16px; }
.pals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pal { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600; text-align: start; }
.pal[aria-pressed="true"] { border-color: var(--pri); box-shadow: 0 0 0 3px var(--glow); }
.sw { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); }
.toast { position: fixed; z-index: 70; inset-block-end: calc(env(safe-area-inset-bottom, 0px) + 22px); inset-inline-start: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.5); }
html[dir="rtl"] .toast { transform: translateX(50%); }

/* ---------- responsive ---------- */
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cal { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .hero, .g-side, .g-studio, .g-list, .g2 { grid-template-columns: minmax(0, 1fr); } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: relative; height: auto; padding: 16px; gap: 12px; }
  .rail-foot, .pulse, .nav h4 { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .nav ul { flex-direction: row; }
  .nav a { white-space: nowrap; }
  .cal { grid-template-columns: minmax(0, 1fr); }
  .day { min-height: 0; }
  .media-row { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) { .item { grid-template-columns: minmax(0, 1fr); } .item .ph { max-width: 160px; } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="pop" id="pop" hidden role="dialog" aria-modal="false" aria-labelledby="popTitle"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="data.js" charset="utf-8"></script>
<script src="i18n.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
